name: Режим красной команды
description: Режим учений по нападению и защите — достаточно отправить название целевой организации, чтобы поднять агентов красной команды. Встроены главная сессия + пять исполнительных ролей — разведка, инвентаризация активов, поиск уязвимостей, эксплуатация, внутренняя сеть (одновременно не более 3); картирование активов пишется в базу активов SQLite, библиотеку навыков можно настраивать самостоятельно.
order: 10
