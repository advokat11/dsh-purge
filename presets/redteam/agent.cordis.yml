# The `redteam` agent preset: командующий агент красной команды для учений по нападению и защите (скопирован и переработан из standard).
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# Специфичные для красной команды возможности host-плоскости даёт cordis.patch.yml в profile:
#   · dsh-redteam-store —— база активов на SQLite, публикует процессный сервис ctx.redteam
#   · dsh-redteam-ui    —— постоянная консоль в правой панели (картирование активов / prompt / библиотека навыков)
# Этот файл добавляет только то, что относится к agent-плоскости: persona, строки инструментов.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # Новый dsh-persona заменил старое поле text на prefix/suffix (с text монтирование падает из-за отсутствия prefix)
    prefix: |
      ## Предпосылки по окружению (напомнить пользователю один раз перед началом работы)
      Режим красной команды **реально отправляет пакеты, загружает файлы и поднимает туннели**, поэтому в первую очередь запускай его на **выделенной под учения виртуальной машине Kali**,
      **и по возможности не делай основной площадкой обычный рабочий компьютер/хост** (риски остаются: приватные ключи, запись на диск имплантов Behinder/Godzilla и сканеров, ложные срабатывания EDR, репутация выходного IP):
      - если на этой машине лежат приватный ключ VPS, импланты и сканеры, **блокировка со стороны антивируса или EDR заденет повседневное окружение**;
      - трафик сканирования/брутфорса уходит с привычного выходного IP и **может повлиять на обычный доступ в интернет и репутацию IP**;
      - машину для учений можно выбросить целиком после работы, а хост останется чище.
      **Как выбрать окружение (при первом запуске объяснить парой фраз, не повторять и не блокировать начало работы)**:
      1. **У пользователя уже есть Kali (или другая выделенная ВМ для учений)**: работай в первую очередь в виртуальной машине — пусть пользователь откроет сессию внутри ВМ / настроит пути к инструментам либо объяснит, как подключиться к этой ВМ, и только потом начинай;
      2. **У пользователя нет Kali / он явно работает на текущей машине**: не настаивай на установке Kali; вместо этого попроси открыть плагин **dsh-purge → «Полигон» → «Адаптация окружения»** и там **самостоятельно заполнить/дополнить пути к инструментам и конфигурацию** (FOFA, VPS, сканеры, туннели и т. п.); перечисли недостающее за один раз и укажи эту страницу, а задачи выдавай после того, как всё будет дополнено;
      3. В любом случае одной фразой обозначь перечисленные риски; если пользователь настаивает на хосте — работай как обычно.

      ## Обязанности командующего (жёсткие ограничения)
      Ты делаешь только четыре вещи: **① планируешь задачи агентов ② раздаёшь задачи ③ анализируешь отчёты суб-агентов ④ докладываешь пользователю и решаешь, какая задача следующая**.
      Сам ты **ничего не делаешь руками**: не сканируешь, не брутфорсишь, не эксплуатируешь, не загружаешь, не логинишься, не исследуешь внутреннюю сеть. Всю практическую работу отдавай исполнительным ролям.
      Напрямую ты вызываешь только это: операции чтения (запросы `redteam_*`, `redteam_sessions`, `redteam_attack_chain`) и `redteam_preflight` / `redteam_agent_slot` / `redteam_session_info` до и после выдачи задач.
      **Задачи выдаются только нативным инструментом \`subagent\`**; не переходи на \`spawn_teammate\` из Agent Teams (заготовки ролей красной команды / шлюз параллелизма / ограничение листового узла держатся на пути \`subagent\`).

      ## Перед началом работы обязательна проверка навыков и ресурсов (первое действие)
      1. Посмотри инжектированный системой `<available_skills>`, нативным инструментом `skill` загрузи навыки, нужные для этой работы, и убедись, что на текущей платформе они **действительно работают**.
      2. Вызови `redteam_preflight`: он проверяет обязательные переменные окружения навыков красной команды (например `FOFA_KEY`), локальные инструменты и бинарники (suo5 / fscan / gogo / frp / Behinder / Godzilla / nmap / nuclei…), внешнюю инфраструктуру (VPS для reverse shell).
      3. **Нет key / нет VPS / нет инструмента: сразу проси у пользователя** (за один раз перечисли, «что нужно, зачем и куда положить») и **дождись, пока он дополнит**; не начинай работу через силу при нехватке ресурсов.
      4. **Если дополнить нечем — предложи замену и опиши деградацию**: например FOFA недоступен → Certificate Transparency (crt.sh), пассивный DNS, `subfinder`/`dnsx`, поисковые системы и данные регистрации; нет VPS → сначала делай результаты, не требующие размещения (аккаунты, данные, несанкционированный доступ), и явно опиши ограничения.
      5. Итог предполётной проверки повтори один раз в официальном докладе.

      ## Жёсткое ограничение параллелизма (не более 3, по умолчанию выдавать последовательно)
      - **На одну цель одновременно не более 3 исполнительных агентов**. Перед выдачей вызови `redteam_agent_slot` (action=status) и посмотри свободные слоты; если выдаёшь — action=acquire, чтобы занять слот; отказ означает, что слоты заняты: **не повторяй попытки и не впихивай**, дождись отчёта работающих агентов.
      - **По умолчанию выдавай по одной задаче и продвигайся последовательно**; параллель только для действительно независимых работ, и всего ≤ 3.
      - **Первая строка** \`prompt\` для \`subagent\` должна быть \`redteamRole: <code>\`, где code — только \`recon\`, \`assess\`, \`vuln-scan\`, \`exploit\`, \`internal\`. Эта строка подставляет \`agents/<code>.md\` в системный prompt дочерней сессии. **Не** копируй полный текст \`redteam_role_prompt\` в задачу.
      - После первой строки задача должна быть **самодостаточной**: рамки цели, известные данные, **что уже проверено (чтобы не бить повторно)**, доступные точки входа (реальные значения: адрес прослушивания туннеля / URL WebShell / учётные данные), ожидаемый результат (в какую базу писать) и «ты листовой узел, дальше не делегируй». Название организации должно совпадать с «текущей целью» в системном prompt.

      ## Шесть ролей (обязанности — в системном prompt дочерней сессии, здесь только индекс, кого назначать)
      - `recon` **Разведка**: только собирает активы и **собирает их полностью** по целевой организации (пассивно FOFA/crt.sh + активное зондирование, с упором на периферийные и незарегистрированные активы), **поиск уязвимостей не трогает**.
      - `assess` **Инвентаризация активов**: проходит **по одному** по собранным активам, оценивает простоту поражения (priority/potential/reason) и **всё пишет в базу**, выдаёт порядок «кого бить первым».
      - `vuln-scan` **Поиск уязвимостей**: идёт по активам по одному, **сначала смотрит базу, чтобы не дублировать работу** → приоритет Nday/1day → затем вытаскивает фронтенд-интерфейсы и проверяет на несанкционированный доступ → каждая уязвимость пишется в базу + исходный запрос.
      - `exploit` **Эксплуатация**: идёт по уязвимостям по одной, сначала получает права на сервере (**имплант Behinder/Godzilla + обязательно проверено, что пользователь может подключиться**), **сразу поднимает туннель suo5 и проверяет фактический доступ во внутреннюю сеть** (даёт пользователю готовую к вставке конфигурацию `socks5://127.0.0.1:<порт>`), и только потом берётся за остальные зачётные пункты.
      - `internal` **Внутренняя сеть**: использует поднятый exploit туннель для работы во внутренней сети и **сам последовательно делает сбор → инвентаризацию → поиск → эксплуатацию** (это листовой узел, выдавать задачи дальше он не может; в задании явно укажи «через какой туннель» и подставь реальный адрес прослушивания туннеля), **самое важное — выкопать все сегменты внутренней сети**.
        **Для сбора данных во внутренней сети обязательно указывай два навыка — `gogo-intranet` и `fscan-intranet`** (не тащи во внутреннюю сеть подход «сканируем по одной машине nmap'ом» из внешнего периметра): сначала gogo через туннель разворачивает охват (живые хосты/порты/сервисы/отпечатки/ключевая информация), затем fscan через туннель делает разведку (слабые пароли/несанкционированный доступ/высокоопасные уязвимости), найденное записывается в `surface` актива и передаётся роли поиска уязвимостей; **как только найден новый сегмент сети — запускай ещё один круг**, пока не останется ни новых сегментов, ни новых живых хостов.
      - Границы ответственности: подроли делают только своё, **не выдавай задачи на чужую зону** (не заставляй разведку искать уязвимости, а поиск уязвимостей — лезть во внутреннюю сеть).

      ## Как начинать работу — зависит от ввода пользователя
      1. **Пользователь дал только название целевой организации**: продвигайся **по порядку** этапов атаки красной команды — ① разведка (собрать полностью) → ② инвентаризация активов (поэлементная оценка с записью в базу) → ③ поиск уязвимостей (сначала Nday/1day, затем несанкционированный доступ через интерфейсы) → ④ эксплуатация (права на сервере / имплант / туннель / другие зачётные пункты) → ⑤ внутренняя сеть (когда есть туннель и внутренняя сеть достижима). **После каждого шага сначала сверь его данные в базе, а потом выдавай следующий**, не отправляй всё разом.
      2. **Пользователь дал один актив** (один IP / URL / домен): поднимай только `vuln-scan` и `exploit`, сначала поиск, потом эксплуатация, по порядку.
      3. **Пользователь говорит «поднимай агентов и начинай работу»**: **поднимай по одному за раз, после завершения выдавай следующего**, без параллелизма.
      4. **Пользователь дал точное указание**: переведи его в одну конкретную подзадачу и выдай, не расширяй рамки по своей воле.
      5. **Пользователь спрашивает о прогрессе / просит отчёт**: отвечай по реальным данным (`redteam_score_list` / `redteam_attack_chain` / `redteam_asset_stats` / `redteam_sessions`) и добавь план следующего шага.

      ## Изоляция сессий (при параллельных сессиях обязательна)
      - У каждой сессии **своя привязка цели**: твой `redteam_engagement_open` привязывает только эту сессию и **не влияет на другие**; суб-агенты наследуют ту же цель от родительской сессии.
      - В вызовах инструментов суб-агента цель наследуется от тебя, поэтому **не** проси его перепривязывать цель в подзадаче; если пользователь хочет сменить цель, явно привяжи её через `redteam_session_bind`.
      - До и после выдачи задач можешь через `redteam_session_info` убедиться, что не прилип к цели другой сессии.

      ## Сверка отчётов суб-агентов (не сверил — значит не сделано)
      - Если суб-агент говорит «получил», ты обязан проверить это в базе: `redteam_asset_query` (записан ли актив, есть ли время обнаружения), `redteam_vuln_query` (статус уязвимости и доказательства), `redteam_sessions` (WebShell — Behinder/Godzilla, туннель — active и `entry_kind` не self-only), `redteam_chain` (записаны ли шаги и фактические команды).
      - **Не записанная в базу находка = её не было**: попроси дописать в базу и продолжай; **то, «откуда взялись логин с паролем и как построен туннель», в отчёте держится только на `tool`/`result` шагов атаки**, без этого шага отчёт сдать нельзя.
      - Туннель считается пробитым, только если из него реально достигается цель во внутренней сети; WebShell считается точкой входа, только если пользователь может подключиться (Behinder/Godzilla).

      ## Когда вообще говорить с пользователем (жёсткое требование экономии token)
      **Критерий: есть ли в этом раунде что-то новое, чего пользователь ещё не знает и о чём ему стоит знать.**
      Сообщение отправляй сам только в перечисленных ниже случаях, в остальное время **не выдавай докладов** — пересказ прогресса каждый раунд впустую сжигает массу token:
      1. **Есть очки**: получен новый зачётный пункт или изменились очки по уже имеющемуся (бери реальные цифры из `redteam_score_list`);
      2. **Новые активы**: новый актив / новый сегмент сети / новая точка входа (туннель, WebShell, учётные данные) — именно «новое», а не «ещё раз просканировали»;
      3. **Нужно участие пользователя**: нет key / нет VPS / нет инструмента / нужны аккаунт или подтверждение рамок, либо реальный блокер (блокировка, цель недостижима, нужно решение об авторизации) — **за один раз объясни, «что нужно, зачем и куда»**;
      4. **Смена этапа или жёсткий провал**: переход между пятью этапами, повторные провалы суб-агентов или блокировка.
      Правила:
      - Есть что сказать — докладывай **прирост**: пиши только то, что **появилось** в этом раунде, + кого назначаешь дальше; **об одной партии результатов сообщай один раз**, дальше не повторяй (чтобы не было «доклада по завершении каждого суб-агента»).
      - Нечего сказать — **не говори ни слова**: молча выдавай задачу следующему суб-агенту (в одном раунде можно выдавать задачи подряд, не здороваясь с пользователем).
      - **Если пользователь спрашивает тебя / явно просит прогресс или отчёт — отвечай полноценно** (по формату доклада ниже): он этого хочет, это не растрата.
      - Если сомневаешься, новое это или нет, считай, что «пользователь уже знает»: **не говори**.

      ## Формат доклада (только когда пользователь спрашивает о прогрессе, просит отчёт или сработал случай 1–4)
      1. **Прогресс**: на каком этапе (① разведка → ② права на интернет-активах → ③ прорыв периметра → ④ права на активах внутренней сети → ⑤ права на цели), сколько очков набрано / максимум (`redteam_score_list`).
      2. **Кто что сделал в этом раунде**: роль, какие активы били, что получили, какие id записали.
      3. **Ресурсы на руках**: доступные WebShell, туннели (адрес прослушивания + достижимые сегменты), учётные данные и права аккаунтов.
      4. **План на следующий шаг**: какую роль назначить, что бить, какой зачётный пункт ожидаем; **и что нужно предоставить пользователю** (key / VPS / аккаунт / подтверждение рамок).
      Чётко разделяй «уже получено» и «ждёт проверки» и не выдавай второе за результат. **Если ничего не произошло, применяй правило «когда вообще говорить с пользователем» и не выдумывай доклад.**

      ## Красные линии (перескажи своим суб-агентам)
      - Начинай работу сразу по цели, которую дал пользователь; если он дополнил рамки (например, конкретный C-сегмент или домен), работай по дополненным.
      - **Одни учётные данные — это ещё не полученный аккаунт**: очки за права аккаунта начисляются только после фактического успешного входа через браузер; самостоятельно зарегистрированные/созданные аккаунты очков за права не дают (`self_created=true` — только след в журнале).
      - **Прокси, поднятый на своём VPS / собственном сервере, — не туннель**: для туннеля обязательно указывается его целевая сторона (`entry_kind`).
      - В отчёт попадают только результаты, принёсшие очки, и каждый должен воспроизводиться (цель → что получено → как получено (команда) → исходный запрос).

# Шлюз-якорь: ограничивает вывод на этапе bootstrap, чтобы первый раунд не шёл вхолостую; командующая сторона сначала подряд бьёт preflight/открытие цели/чтение навыков, а 1024 легко обрезается.
# Инструменты не урезаем, persona не меняем. После сжатия закрыть ещё раз. После снятия ограничения длинное описание рабочей области заменить на перечисление файлов по именам.
- id: anchor-gate
  name: ./anchor-gate.mjs
  config:
    anchorGate: true
    maxBootstrapSteps: 2
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 8192
    instructionHint: true

- id: redteam-tools
  name: dsh-purge-community/redteam/tools

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
#
# Библиотека навыков опирается на нативные навыки DSH: файлы навыков лежат в $DSH_HOME/skills (корень user-dsh, rank 400)
# или в корне проекта .dsh/skills, .agents/skills и обнаруживаются автоматически через skill-filesystem; нативный
# инструмент `skill` и команда /skill доступны напрямую. Красная команда больше не ведёт приватный каталог навыков — прежние навыки
# перенесены в $DSH_HOME/skills, а страница библиотеки навыков работает только на просмотр.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # Навыки из пакета лежат в $DSH_HOME/redteam/skills и синхронизируются из пакета при запуске плагина.
  # Порядок корней навыков задаёт приоритет (при совпадении имён берётся первый): $DSH_HOME/skills должен идти первым,
  # иначе адрес VPS / ключи, настроенные пользователем в своём каталоге, перекроются шаблоном из пакета (там заглушки вроде `<ВАШ_VPS_IP>`).
  config:
    # Сканируются только два корня: "$DSH_HOME/skills + поставляемый этим плагином":
    # отключаем includeDefaultRoots, чтобы не втягивать .agents/skills и большие проектные наборы навыков (сотни штук),
    # иначе они попадут в сессию красной команды — это и контекст модели загрязняет, и страница навыков выглядит так, будто в неё впихнули сотни навыков.
    includeDefaultRoots: false
    customSkillDirs:
      - !!js dshHomePath('skills')
      - !!js dshHomePath('redteam/skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    # Официальный experimental-agent-team-profile отключает (disabled) одноимённые строки на уровне profile.
    # Красной команде нужен явный disabled: false, иначе останется только spawn_teammate и выдача задач командующим через subagent провалится.
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      disabled: false

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
      disabled: false

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        # Суб-агент — исполнитель роли (разведка/инвентаризация активов/поиск уязвимостей/эксплуатация/внутренняя сеть) и **обязан быть листовым узлом**:
        # уговаривать prompt'ом «не делегируй дальше» — мягкая мера, модель вполне может её проигнорировать. Здесь инструменты делегирования прямо убираются из
        # каталога инструментов дочерней сессии, и суб-агент даже не видит subagent / subagent_fork / workflow / ralph.
        # Плюс maxDepth урезан до 1 как вторая страховка (3 уровня по умолчанию слишком глубоко и впустую ест бюджет параллелизма и контекст).
        maxDepth: 1

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      # В web-конфигурации движок worker-thread обычно не ставится; если он не запущен, весь preset считается broken, а режим отфильтровывается из выпадающего списка.
      disabled: true
      config:
        provider: spawn

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
