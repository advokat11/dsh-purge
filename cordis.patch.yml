# dsh-purge bundle patch
#
# Очистка и полигон живут внутри этого плагина (lib/redteam, presets/redteam, skills/redteam).
# Ставится только dsh-purge, без внешних и линкованных redteam-пакетов.

# Отключаем строки старых отдельных redteam-пакетов (если раньше ставили dsh-redteam-mode)
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # The runtime checks cwd availability; the config layer must not require it.
    personaSuffix: ""

- insert:
    - id: dsh-purge
      name: 'dsh-purge-community'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        excludePresets: []
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "Продолжить"
        capabilityProtocol: true
        hooksDenyBypass: true

    # Полигон: пресеты + установка навыков (lib/redteam этого плагина)
    - id: dsh-purge-redteam
      name: dsh-purge-community/redteam

    # Встроенные agent-пресеты: unrestricted (без ограничений)
    - id: dsh-purge-presets
      name: dsh-purge-community/presets-plugin

    # База фактов полигона (SQLite), данные в $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge-community/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # HTTP-мост полигона POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge-community/redteam/ui
